<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Withdrawal Portal</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind Config (Matches Main System) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: { 
                            50:'#eff6ff', 100:'#dbeafe', 500:'#3b82f6', 600:'#2563eb', 
                            700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a8a' 
                        },
                        slate: { 850: '#151e2e' }
                    },
                    fontFamily: { sans: ['"Roboto"', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f1f5f9; }
        .glass-panel { background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-radius: 12px; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
        .scan-anim { animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 0% { border-color: #3b82f6; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { border-color: #3b82f6; box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { border-color: #3b82f6; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
    </style>
</head>
<body class="text-slate-700 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-lg z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded bg-royal-600 flex items-center justify-center text-white shadow-lg">
                    <i class="fas fa-dolly text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Withdrawal Portal</h1>
                    <p class="text-xs text-slate-400 uppercase font-semibold tracking-wider">Direct Stock Issue</p>
                </div>
            </div>
           <!-- <a href="Trans-System.html" class="text-sm bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full transition border border-slate-700">
                <i class="fas fa-arrow-left mr-2"></i> Back to Dashboard -->
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- LEFT COLUMN: INPUT FORM -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- Requester Info -->
            <div class="glass-panel p-6">
                <h3 class="font-bold text-slate-800 text-lg mb-4 flex items-center">
                    <span class="w-8 h-8 rounded-full bg-royal-100 text-royal-600 flex items-center justify-center mr-3 text-sm">1</span>
                    Recipient Details
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Select Designation</label>
                        <select id="w-dept" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-royal-500 focus:border-royal-500 bg-slate-50">
                            <option value="">Loading Departments...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Withdrawer Name</label>
                        <input type="text" id="w-name" placeholder="e.g. John Doe" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-royal-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Transaction Refference Number</label>
                        <input type="text" id="w-ref" readonly class="w-full p-3 bg-slate-100 text-slate-500 border border-slate-200 rounded-lg font-mono font-bold">
                    </div>
                </div>
            </div>

            <!-- Item Selection -->
            <div class="glass-panel p-6 flex-1">
                <h3 class="font-bold text-slate-800 text-lg mb-4 flex items-center">
                    <span class="w-8 h-8 rounded-full bg-royal-100 text-royal-600 flex items-center justify-center mr-3 text-sm">2</span>
                    Select Items
                </h3>
                
                <div class="relative mb-4">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Search Item</label>
                    <select id="w-item-select" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-royal-500 bg-white" onchange="checkStock(this.value)">
                        <option value="">-- Choose Material --</option>
                    </select>
                </div>

                <!-- Live Stock Display -->
                <div id="stock-display" class="hidden mb-4 p-4 rounded-lg bg-royal-50 border border-royal-100 flex justify-between items-center transition-all">
                    <div>
                        <p class="text-xs text-royal-600 font-bold uppercase">Available Stock</p>
                        <p class="text-2xl font-bold text-royal-800" id="stock-qty-display">0</p>
                        <p class="text-xs text-slate-500" id="stock-uom-display">PCS</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-slate-500 font-bold uppercase mb-1">Shelf Location</p>
                        <span class="px-2 py-1 bg-white rounded text-xs border border-royal-200 font-mono">A-12</span>
                    </div>
                </div>

                <div class="flex gap-4 items-end">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Quantity to Issue</label>
                        <input type="number" id="w-qty" min="1" value="1" class="w-full p-3 border border-slate-300 rounded-lg font-bold text-lg text-center">
                    </div>
                    <button onclick="addToCart()" class="h-[52px] px-6 bg-royal-600 hover:bg-royal-700 text-white font-bold rounded-lg shadow-md transition flex items-center">
                        <i class="fas fa-plus mr-2"></i> Add
                    </button>
                </div>
                <p id="error-msg" class="text-red-500 text-xs mt-2 font-bold h-4"></p>
            </div>
        </div>

        <!-- RIGHT COLUMN: CART & SUMMARY -->
        <div class="lg:col-span-7 flex flex-col h-full">
            <div class="glass-panel flex flex-col h-full overflow-hidden">
                <div class="p-5 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 flex items-center">
                        <i class="fas fa-list-alt text-slate-400 mr-2"></i> Items to Withdraw
                    </h3>
                   <!-- <button onclick="clearCart()" class="text-xs text-red-500 hover:text-red-700 font-medium">Clear All</button>-->
                </div>

                <!-- Table Header -->
                <div class="grid grid-cols-12 bg-slate-100 text-xs font-bold text-slate-500 uppercase py-3 px-4 border-b border-slate-200">
                    <div class="col-span-2">Code</div>
                    <div class="col-span-5">Description</div>
                    <div class="col-span-3 text-center">Qty</div>
                    <div class="col-span-2 text-right">Action</div>
                </div>

                <!-- Table Body (Scrollable) -->
                <div class="flex-1 overflow-y-auto bg-white" id="cart-container">
                    <!-- Empty State -->
                    <div id="empty-cart" class="h-full flex flex-col items-center justify-center text-slate-300 opacity-60">
                        <i class="fas fa-box-open text-6xl mb-4"></i>
                        <p class="font-medium">No items added yet</p>
                    </div>
                    <!-- Items will be injected here via JS -->
                    <div id="cart-list"></div>
                </div>

                <!-- Footer / Action -->
                <div class="p-6 bg-slate-50 border-t border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm font-medium text-slate-500">Total Items:</span>
                        <span id="total-items-count" class="text-xl font-bold text-royal-800">0</span>
                    </div>
                    <button onclick="processTransaction()" id="btn-process" disabled class="w-full py-4 bg-slate-300 text-slate-500 font-bold rounded-lg shadow-sm text-lg transition cursor-not-allowed">
                        Process Withdrawal
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- LOGIC SCRIPT -->
    <script>
        // --- CONFIGURATION (MUST MATCH MAIN FILE) ---
        const SB_URL = 'https://agggkqvbnotpborqcitx.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnZ2drcXZibm90cGJvcnFjaXR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwODYxNjgsImV4cCI6MjA4MTY2MjE2OH0.XJHmLfRRJHVhsrImqnRpdwt7eN4eiO1VGk6B68uG5oo';
        
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        
        // --- STATE ---
        let inventory = [];
        let cart = [];

        $(document).ready(async () => {
            initSystem();
        });

        async function initSystem() {
            generateRef();
            await loadData();
        }

        function generateRef() {
            $('#w-ref').val('WR-' + Date.now().toString().slice(-6));
        }

        async function loadData() {
            try {
                // 1. Load Departments
                const { data: depts } = await supabaseClient.from('departments').select('*').order('name');
                if(depts) {
                    $('#w-dept').html('<option value="">Select Designation</option>' + 
                        depts.map(d => `<option value="${d.name}">${d.name}</option>`).join(''));
                }

                // 2. Load Active Inventory
                const { data: inv } = await supabaseClient.from('inventory').select('*').neq('status', 'ARCHIVED').gt('current_stock', 0);
                inventory = inv || [];

                populateItemSelect();

            } catch (e) {
                console.error(e);
                Swal.fire('Connection Error', 'Failed to load system data.', 'error');
            }
        }

        function populateItemSelect() {
            let html = '<option value="">-- Choose Material --</option>';
            inventory.forEach(item => {
                html += `<option value="${item.material_code}">${item.material_code} - ${item.description}</option>`;
            });
            $('#w-item-select').html(html);
        }

        // --- UI LOGIC ---

        function checkStock(code) {
            $('#error-msg').text('');
            if(!code) {
                $('#stock-display').addClass('hidden');
                return;
            }
            const item = inventory.find(i => i.material_code === code);
            if(item) {
                $('#stock-qty-display').text(item.current_stock);
                $('#stock-uom-display').text(item.uom);
                $('#stock-display').removeClass('hidden');
                
                // Visual feedback if low
                if(item.current_stock <= item.low_stock_threshold) {
                    $('#stock-display').removeClass('bg-royal-50 border-royal-100').addClass('bg-amber-50 border-amber-200');
                    $('#stock-qty-display').addClass('text-amber-600').removeClass('text-royal-800');
                } else {
                    $('#stock-display').addClass('bg-royal-50 border-royal-100').removeClass('bg-amber-50 border-amber-200');
                    $('#stock-qty-display').removeClass('text-amber-600').addClass('text-royal-800');
                }
            }
        }

        function addToCart() {
            const code = $('#w-item-select').val();
            const qty = parseInt($('#w-qty').val());

            // Validation
            $('#error-msg').text('');
            if(!code) return $('#error-msg').text('Please select an item.');
            if(isNaN(qty) || qty <= 0) return $('#error-msg').text('Invalid quantity.');

            const item = inventory.find(i => i.material_code === code);
            
            // Check real stock
            if(qty > item.current_stock) return $('#error-msg').text(`Only ${item.current_stock} available.`);

            // Check if already in cart
            const existing = cart.find(c => c.code === code);
            if(existing) {
                if(existing.qty + qty > item.current_stock) {
                    return $('#error-msg').text(`Total cart quantity exceeds stock.`);
                }
                existing.qty += qty;
            } else {
                cart.push({
                    code: item.material_code,
                    name: item.description,
                    qty: qty,
                    uom: item.uom,
                    max: item.current_stock
                });
            }

            renderCart();
            // Reset input
            $('#w-qty').val(1);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        function renderCart() {
            const container = $('#cart-list');
            const empty = $('#empty-cart');
            const btn = $('#btn-process');
            
            container.empty();
            
            if(cart.length === 0) {
                empty.removeClass('hidden');
                btn.prop('disabled', true).removeClass('bg-emerald-600 text-white hover:bg-emerald-700').addClass('bg-slate-300 text-slate-500 cursor-not-allowed');
                $('#total-items-count').text('0');
                return;
            }

            empty.addClass('hidden');
            btn.prop('disabled', false).addClass('bg-emerald-600 text-white hover:bg-emerald-700').removeClass('bg-slate-300 text-slate-500 cursor-not-allowed');

            let totalItems = 0;

            cart.forEach((item, idx) => {
                totalItems += item.qty;
                container.append(`
                    <div class="grid grid-cols-12 items-center py-3 px-4 border-b border-slate-100 hover:bg-slate-50 transition">
                        <div class="col-span-2 font-mono font-bold text-xs text-royal-700">${item.code}</div>
                        <div class="col-span-5 text-sm truncate pr-2">${item.name}</div>
                        <div class="col-span-3 text-center font-bold bg-slate-100 rounded py-1 text-sm">${item.qty}</div>
                        <div class="col-span-2 text-right">
                            <button onclick="removeFromCart(${idx})" class="text-slate-400 hover:text-red-500 transition"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `);
            });

            $('#total-items-count').text(totalItems);
        }

        // --- SUBMISSION LOGIC ---

        async function processTransaction() {
            const dept = $('#w-dept').val();
            const name = $('#w-name').val();
            const ref = $('#w-ref').val();

            if(!dept) return Swal.fire('Missing Info', 'Please select a Department.', 'warning');
            if(!name) return Swal.fire('Missing Info', 'Please enter Recipient Name.', 'warning');

            // Confirm
            const result = await Swal.fire({
                title: 'Confirm Withdrawal',
                text: `Issue ${cart.length} line items to ${name}? Stock will be deducted immediately.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                confirmButtonText: 'Yes, Issue Stock'
            });

            if(!result.isConfirmed) return;

            // Show Loading
            Swal.fire({
                title: 'Processing...',
                html: 'Updating Inventory Records',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading() }
            });

            try {
                // 1. Create Header (Directly APPROVED because this is a direct issue portal)
                const { data: wrData, error: wrError } = await supabaseClient
                    .from('withdrawal_requests')
                    .insert([{
                        wr_number: ref,
                        requester_name: name,
                        department: dept,
                        status: 'APPROVED', 
                        remarks: 'Direct Issue via Portal'
                    }])
                    .select();

                if(wrError) throw wrError;
                const wrId = wrData[0].wr_id;

                // 2. Loop Items: Insert WR Item, Deduct Inventory, Log Movement
                for (const item of cart) {
                    
                    // A. Insert WR Item
                    await supabaseClient.from('wr_items').insert([{
                        wr_id: wrId,
                        material_code: item.code,
                        quantity_requested: item.qty
                    }]);

                    // B. Deduct Stock (Get fresh data first to ensure atomic safety, ideally RPC but Client side for now)
                    const { data: freshItem } = await supabaseClient.from('inventory').select('current_stock, total_withdrawn').eq('material_code', item.code).single();
                    
                    const newStock = freshItem.current_stock - item.qty;
                    const newWithdrawn = (freshItem.total_withdrawn || 0) + item.qty;

                    await supabaseClient.from('inventory')
                        .update({ current_stock: newStock, total_withdrawn: newWithdrawn })
                        .eq('material_code', item.code);

                    // C. Log Movement
                    await supabaseClient.from('stock_movements').insert([{
                        material_code: item.code,
                        change_amount: -item.qty, // Negative for withdrawal
                        reason: `WR: ${wrId} (Direct Issue)`
                    }]);
                }

                // Success
                await Swal.fire({
                    icon: 'success',
                    title: 'Transaction Successful',
                    text: `Stock has been deducted. Ref: ${ref}`,
                    timer: 2000,
                    showConfirmButton: false
                });

                // Reset UI
                cart = [];
                renderCart();
                generateRef();
                $('#w-name').val('');
                $('#w-item-select').val('').trigger('change');
                $('#stock-display').addClass('hidden');
                
                // Reload data to get fresh stock counts for next transaction
                await loadData();

            } catch (err) {
                console.error(err);
                Swal.fire('Transaction Failed', err.message, 'error');
            }
        }
    </script>

    <script scr="js/auth.js"></script>
    
</body>
</html>
