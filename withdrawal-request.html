<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Withdrawal Portal</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb', // Standard Blue
                        primaryHover: '#1d4ed8',
                        danger: '#dc2626',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* Clean Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

        /* Loader */
        #loader-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: #ffffff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            border: 3px solid #f3f3f3; border-top: 3px solid #2563eb;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 pb-24" onclick="closeAllDropdowns(event)">

    <!-- Simple Loader -->
    <div id="loader-overlay">
        <div class="spinner mb-3"></div>
        <p class="text-sm font-medium text-gray-500">Loading...</p>
    </div>

    <!-- Simple Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fas fa-box text-primary text-xl"></i>
                <h1 class="font-semibold text-lg text-gray-800">Withdrawal Form</h1>
            </div>
            <div id="gps-badge" class="px-2 py-1 rounded bg-gray-100 text-xs font-medium text-gray-500 border border-gray-200">
                <i class="fas fa-location-arrow mr-1"></i> <span id="gps-text">Locating...</span>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 mt-6 space-y-6">

        <!-- Scanner Alert -->
        <div id="scan-alert" class="hidden bg-blue-50 border border-blue-200 rounded-md p-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-qrcode text-blue-600"></i>
                <div>
                    <p class="text-xs text-blue-600 uppercase font-bold">Scanned Item</p>
                    <p class="font-medium text-sm text-gray-800" id="scan-msg">...</p>
                </div>
            </div>
            <button onclick="$('#scan-alert').hide()" class="text-gray-400 hover:text-gray-600">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form id="withdrawal-form" class="space-y-6">
            
            <!-- Requester Details Card -->
            <section class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-5 py-3 border-b border-gray-100 bg-gray-50">
                    <h2 class="text-sm font-bold text-gray-700 uppercase">Requester Information</h2>
                </div>
                <div class="p-5 grid gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="req-name" required placeholder="Enter your name" 
                            class="w-full rounded-md border-gray-300 border px-3 py-2 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                        <div class="relative">
                            <select id="req-dept" required 
                                class="w-full rounded-md border-gray-300 border px-3 py-2 text-sm bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none">
                                <option value="" disabled selected>Select Department...</option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-3 top-3 text-xs text-gray-400 pointer-events-none"></i>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Purpose / Note</label>
                        <textarea id="req-reason" rows="2" placeholder="Describe usage..." 
                            class="w-full rounded-md border-gray-300 border px-3 py-2 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none"></textarea>
                    </div>
                </div>
            </section>

            <!-- Items Section -->
            <section class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-visible">
                <div class="px-5 py-3 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                    <h2 class="text-sm font-bold text-gray-700 uppercase">Items to Withdraw</h2>
                    <button type="button" onclick="addItemRow()" 
                        class="text-xs font-semibold text-primary hover:text-primaryHover flex items-center gap-1">
                        <i class="fas fa-plus"></i> Add Item
                    </button>
                </div>
                
                <div class="p-5">
                    <div id="items-container" class="space-y-3">
                        <!-- Dynamic Rows -->
                    </div>

                    <div id="empty-state" class="text-center py-8">
                        <p class="text-gray-400 text-sm">No items selected yet.</p>
                        <button type="button" onclick="addItemRow()" class="mt-2 text-sm text-primary underline">Add your first item</button>
                    </div>
                </div>
            </section>
        </form>
    </main>

    <!-- Bottom Action Bar -->
    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 z-50">
        <div class="max-w-2xl mx-auto flex items-center justify-between gap-4">
            <div class="hidden sm:block">
                <span class="text-xs text-gray-500 uppercase font-bold">Total Qty:</span>
                <span class="text-lg font-bold text-gray-800 ml-1" id="total-count-display">0</span>
            </div>
            <button onclick="$('#withdrawal-form').submit()" id="submit-btn" 
                class="flex-1 bg-primary hover:bg-primaryHover text-white font-medium py-3 rounded-md shadow-sm transition-colors text-sm flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                <span>Confirm Request</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- Simple Toast -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[100] hidden">
        <div class="bg-gray-800 text-white px-4 py-2 rounded shadow-lg flex items-center gap-2 text-sm">
            <i id="toast-icon"></i>
            <span id="toast-msg">Notification</span>
        </div>
    </div>

    <script>
        // --- Same Logic, Simplified Display ---
        const SUPABASE_URL = 'https://airrabkojxzzilgdcraz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpcnJhYmtvanh6emlsZ2RjcmF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg4NjY4MjEsImV4cCI6MjA3NDQ0MjgyMX0._XUe8Mk7jjY4RGyzaJ44mN5slfIP8pPYLNjcJYQkg-g';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let inventoryList = [];
        let collectedDeviceData = {};
        let loaderRemoved = false;

        function removeLoader() {
            if (loaderRemoved) return;
            loaderRemoved = true;
            $('#loader-overlay').fadeOut(200);
        }

        $(document).ready(async () => {
            setTimeout(removeLoader, 1500);
            initGPS();
            await loadInitialData();
            
            // Scanner Logic
            const urlParams = new URLSearchParams(window.location.search);
            const scannedId = urlParams.get('id');
            if(scannedId && inventoryList.length > 0) {
                const item = inventoryList.find(i => i.id == scannedId);
                if(item) {
                    addItemRow(item.id);
                    $('#scan-msg').text(item.name);
                    $('#scan-alert').removeClass('hidden');
                } else {
                    addItemRow();
                }
            } else {
                addItemRow();
            }
            removeLoader();
        });

        async function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        collectedDeviceData.geo = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                        $('#gps-text').text('Location Secured').addClass('text-green-600');
                        $('#gps-badge').addClass('bg-green-50 border-green-200');
                    },
                    (err) => { 
                        $('#gps-text').text('Location Off'); 
                    }
                );
            }
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                collectedDeviceData.ip = data.ip;
                collectedDeviceData.ua = navigator.userAgent;
            } catch(e) {
                collectedDeviceData.ip = "Unknown";
            }
        }

        async function loadInitialData() {
            try {
                const { data: config } = await supabase.from('master_data').select('*').eq('key', 'config').single();
                const depts = config?.data?.departments || ['Maintenance', 'Operation', 'Admin', 'Safety', 'Logistics'];
                depts.forEach(d => $('#req-dept').append(`<option value="${d}">${d}</option>`));

                const { data: inv } = await supabase.from('inventory').select('*').gt('stock', 0).order('name');
                inventoryList = inv || [];
            } catch (err) { console.error(err); }
        }

        function addItemRow(preId = null) {
            $('#empty-state').hide();
            const rowId = 'row-' + Date.now();
            
            // Simplified Dropdown List
            let listItemsHtml = '';
            inventoryList.forEach(i => {
                listItemsHtml += `
                    <div class="dropdown-item p-2 hover:bg-gray-100 cursor-pointer border-b border-gray-100 last:border-0 flex items-center gap-3" 
                         onclick="selectItem('${rowId}', ${i.id})"
                         data-name="${i.name.toLowerCase()}">
                        <div class="w-8 h-8 rounded bg-gray-200 overflow-hidden flex-shrink-0">
                             ${i.image ? `<img src="${i.image}" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center text-gray-400 text-xs"><i class="fas fa-image"></i></div>'}
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-bold text-gray-700 truncate">${i.name}</p>
                            <p class="text-[10px] text-gray-500">Stock: ${i.stock} ${i.unit || 'pcs'}</p>
                        </div>
                    </div>
                `;
            });

            // Initial Button State
            let initialDisplay = '<span class="text-gray-400">Select Item...</span>';
            let hiddenVal = "";

            if(preId) {
                const item = inventoryList.find(i => i.id == preId);
                if(item) {
                    hiddenVal = item.id;
                    initialDisplay = `<span class="font-medium text-gray-800">${item.name}</span> <span class="text-xs text-gray-500 ml-2">(${item.stock} left)</span>`;
                }
            }

            const html = `
                <div id="${rowId}" class="item-row bg-white border border-gray-200 p-3 rounded-md relative group">
                    <button type="button" onclick="removeRow('${rowId}')" 
                        class="absolute top-2 right-2 text-gray-300 hover:text-danger p-1">
                        <i class="fas fa-times"></i>
                    </button>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-[1fr_120px] gap-3">
                        <div class="relative">
                            <input type="hidden" class="item-select-value" value="${hiddenVal}">
                            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Item Name</label>
                            
                            <button type="button" class="dropdown-trigger w-full bg-gray-50 border border-gray-200 rounded px-3 py-2 text-sm text-left flex justify-between items-center" onclick="toggleDropdown('${rowId}', event)">
                                <div class="truncate mr-2">${initialDisplay}</div>
                                <i class="fas fa-caret-down text-gray-400"></i>
                            </button>

                            <div id="dropdown-${rowId}" class="custom-dropdown hidden absolute top-full left-0 w-full bg-white border border-gray-200 shadow-lg rounded mt-1 z-50 max-h-[200px] flex flex-col">
                                <div class="p-2 border-b border-gray-100 bg-gray-50">
                                    <input type="text" class="w-full text-xs p-1.5 rounded border border-gray-300 focus:outline-none focus:border-primary" 
                                           placeholder="Search..." onkeyup="filterDropdown(this)">
                                </div>
                                <div class="overflow-y-auto flex-1 custom-scrollbar">
                                    ${listItemsHtml}
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Quantity</label>
                            <div class="flex items-center h-[38px]">
                                <button type="button" onclick="stepQty('${rowId}', -1)" class="w-8 h-full bg-gray-100 border border-gray-200 rounded-l hover:bg-gray-200 text-gray-600 font-bold">-</button>
                                <input type="number" min="1" value="1" oninput="validateQty(this); updateTotal()" 
                                    class="qty-input w-full h-full text-center border-y border-gray-200 text-sm font-semibold outline-none appearance-none" required>
                                <button type="button" onclick="stepQty('${rowId}', 1)" class="w-8 h-full bg-gray-100 border border-gray-200 rounded-r hover:bg-gray-200 text-gray-600 font-bold">+</button>
                            </div>
                            <p class="qty-error text-[10px] text-danger mt-1 hidden">Max exceeded</p>
                        </div>
                    </div>
                </div>
            `;
            
            const $row = $(html);
            $('#items-container').append($row);
            
            if(preId) {
                const item = inventoryList.find(i => i.id == preId);
                updateRowLimit($row, item);
            }
            updateTotal();
        }

        // --- Standard Logic Functions ---

        function toggleDropdown(rowId, event) {
            event.stopPropagation();
            $('.custom-dropdown').not(`#dropdown-${rowId}`).addClass('hidden');
            $(`#dropdown-${rowId}`).toggleClass('hidden');
            if(!$(`#dropdown-${rowId}`).hasClass('hidden')) {
                $(`#dropdown-${rowId}`).find('input').focus();
            }
        }

        function closeAllDropdowns(event) {
            if (!$(event.target).closest('.custom-dropdown, .dropdown-trigger').length) {
                $('.custom-dropdown').addClass('hidden');
            }
        }

        function filterDropdown(input) {
            const term = $(input).val().toLowerCase();
            $(input).closest('.custom-dropdown').find('.dropdown-item').each(function() {
                $(this).toggle($(this).data('name').includes(term));
            });
        }

        function selectItem(rowId, itemId) {
            const item = inventoryList.find(i => i.id === itemId);
            if (!item) return;

            const $row = $(`#${rowId}`);
            $row.find('.item-select-value').val(item.id);
            
            $row.find('.dropdown-trigger div').html(`<span class="font-medium text-gray-800">${item.name}</span> <span class="text-xs text-gray-500">(${item.stock})</span>`);
            $row.find('.custom-dropdown').addClass('hidden');
            updateRowLimit($row, item);
        }

        function updateRowLimit($row, item) {
            const $input = $row.find('.qty-input');
            $input.attr('max', item.stock).val(1);
            validateQty($input[0]);
            updateTotal();
        }

        function stepQty(rowId, step) {
            const $input = $(`#${rowId} .qty-input`);
            let val = parseInt($input.val()) || 0;
            let newVal = val + step;
            if(newVal < 1) newVal = 1;
            $input.val(newVal);
            validateQty($input[0]);
            updateTotal();
        }

        function validateQty(el) {
            const $el = $(el);
            const $row = $el.closest('.item-row');
            const max = parseInt($el.attr('max')) || 999;
            const val = parseInt($el.val()) || 0;

            if(val > max) {
                $el.addClass('text-danger');
                $row.find('.qty-error').removeClass('hidden');
                $('#submit-btn').prop('disabled', true);
            } else {
                $el.removeClass('text-danger');
                $row.find('.qty-error').addClass('hidden');
                checkGlobalValidity();
            }
        }

        function checkGlobalValidity() {
            $('#submit-btn').prop('disabled', $('.qty-error:visible').length > 0);
        }

        function removeRow(id) {
            $(`#${id}`).remove();
            if($('#items-container').children().length === 0) $('#empty-state').show();
            updateTotal();
        }

        function updateTotal() {
            let total = 0;
            $('.qty-input').each(function() { total += parseInt($(this).val()) || 0; });
            $('#total-count-display').text(total);
        }

        function showToast(msg, type = 'success') {
            const $toast = $('#toast');
            $('#toast-msg').text(msg);
            
            const iconClass = type === 'success' ? 'fas fa-check-circle text-green-400' : 'fas fa-exclamation-circle text-red-400';
            $('#toast-icon').attr('class', iconClass);

            $toast.removeClass('hidden').fadeIn();
            setTimeout(() => $toast.fadeOut(), 3000);
        }

        $('#withdrawal-form').on('submit', async function(e) {
            e.preventDefault();
            const $btn = $('#submit-btn');
            
            const items = [];
            $('.item-row').each(function() {
                const id = $(this).find('.item-select-value').val();
                const qty = parseInt($(this).find('.qty-input').val());
                if(id && qty > 0) {
                    const itemObj = inventoryList.find(i => i.id == id);
                    if(itemObj) items.push({ id: id, name: itemObj.name, qty: qty, unit: itemObj.unit });
                }
            });

            if(items.length === 0) return showToast("Please add items first", "error");

            $btn.html('<i class="fas fa-spinner fa-spin"></i> Processing...').prop('disabled', true);

            try {
                const payload = {
                    requester: $('#req-name').val(),
                    department: $('#req-dept').val(),
                    reason: $('#req-reason').val() + " [Web]",
                    items: items,
                    status: 'Pending',
                    date: new Date().toLocaleDateString(),
                    metadata: collectedDeviceData
                };

                const { error } = await supabase.from('requests').insert(payload);
                if(error) throw error;

                $btn.html('<i class="fas fa-check"></i> Sent').addClass('bg-green-600');
                showToast("Request Submitted!", "success");
                setTimeout(() => window.location.reload(), 1500);

            } catch (err) {
                console.error(err);
                showToast("Submission Failed", "error");
                $btn.html('Confirm Request <i class="fas fa-arrow-right ml-2"></i>').prop('disabled', false).removeClass('bg-green-600');
            }
        });
    </script>
</body>
</html>
