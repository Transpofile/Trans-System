<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Withdrawal Portal</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: { 
                            50:'#eff6ff', 100:'#dbeafe', 500:'#3b82f6', 600:'#2563eb', 
                            700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a8a' 
                        },
                        slate: { 850: '#151e2e' }
                    },
                    fontFamily: { sans: ['"Roboto"', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; font-family: 'Roboto', sans-serif; }
        .glass-panel { background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border-radius: 12px; }
        
        /* Images */
        .img-preview { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0; }
        .img-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0; }
        .img-placeholder-lg { width: 64px; height: 64px; background: #f1f5f9; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 1.5rem; }
        .img-placeholder-sm { width: 40px; height: 40px; background: #f1f5f9; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #cbd5e1; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="text-slate-700 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-lg z-50 flex-none">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded bg-royal-600 flex items-center justify-center text-white shadow-lg ring-2 ring-royal-500 ring-offset-2 ring-offset-slate-900">
                    <i class="fas fa-dolly text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Withdrawal Portal</h1>
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Inventory Distribution Point</p>
                </div>
            </div>
            <div class="text-right hidden md:block">
                <div class="text-xs text-slate-400 uppercase font-bold">Current Session</div>
                <div class="font-mono text-emerald-400 font-bold" id="clock">00:00:00</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 overflow-hidden">
        
        <!-- LEFT COLUMN: INPUT FORM -->
        <div class="lg:col-span-5 flex flex-col gap-6 overflow-y-auto pr-1">
            
            <!-- Step 1: Recipient -->
            <div class="glass-panel p-6 border-l-4 border-royal-500">
                <h3 class="font-bold text-slate-800 text-lg mb-4 flex items-center">
                    <span class="w-7 h-7 rounded-full bg-royal-100 text-royal-600 flex items-center justify-center mr-3 text-xs font-bold ring-1 ring-royal-200">1</span>
                    Recipient Details
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Department / Designation</label>
                        <select id="w-dept" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-royal-500 focus:border-royal-500 bg-white text-sm">
                            <option value="">Loading Departments...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Withdrawer Name</label>
                        <input type="text" id="w-name" placeholder="e.g. John Doe" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-royal-500 focus:outline-none text-sm font-medium">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Transaction Ref (Auto)</label>
                        <input type="text" id="w-ref" readonly class="w-full p-2.5 bg-slate-100 text-slate-500 border border-slate-200 rounded-lg font-mono font-bold text-sm tracking-wide">
                    </div>
                </div>
            </div>

            <!-- Step 2: Item Selection -->
            <div class="glass-panel p-6 flex-1 border-l-4 border-amber-500">
                <h3 class="font-bold text-slate-800 text-lg mb-4 flex items-center">
                    <span class="w-7 h-7 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mr-3 text-xs font-bold ring-1 ring-amber-200">2</span>
                    Select Items
                </h3>
                
                <div class="relative mb-4">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Search Item</label>
                    <select id="w-item-select" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 bg-white text-sm" onchange="checkStock(this.value)">
                        <option value="">-- Choose Material --</option>
                    </select>
                </div>

                <!-- Live Stock Display -->
                <div id="stock-display" class="hidden mb-6 p-4 rounded-lg bg-royal-50 border border-royal-100 flex items-center gap-4 transition-all shadow-sm">
                    <div id="stock-img-container">
                        <!-- Image injected via JS -->
                    </div>
                    <div class="flex-1">
                        <p class="text-[10px] text-royal-600 font-bold uppercase tracking-wider">Available Stock</p>
                        <div class="flex items-baseline gap-1">
                            <p class="text-3xl font-bold text-royal-800" id="stock-qty-display">0</p>
                            <p class="text-xs text-slate-500 font-bold" id="stock-uom-display">PCS</p>
                        </div>
                        <div class="text-xs text-slate-500 truncate w-48" id="stock-desc-display"></div>
                    </div>
                </div>

                <div class="flex gap-3 items-end">
                    <div class="w-24">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Qty</label>
                        <input type="number" id="w-qty" min="1" value="1" class="w-full p-3 border border-slate-300 rounded-lg font-bold text-xl text-center focus:ring-2 focus:ring-amber-500 outline-none text-slate-700">
                    </div>
                    <button onclick="addToCart()" class="flex-1 h-[54px] bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-lg shadow-md transition flex items-center justify-center text-sm uppercase tracking-wide">
                        <i class="fas fa-plus-circle mr-2 text-lg"></i> Add to List
                    </button>
                </div>
                <p id="error-msg" class="text-red-500 text-xs mt-2 font-bold h-4 text-center"></p>
            </div>
        </div>

        <!-- RIGHT COLUMN: CART & SUMMARY -->
        <div class="lg:col-span-7 flex flex-col h-full overflow-hidden">
            <div class="glass-panel flex flex-col h-full overflow-hidden border-t-4 border-emerald-500">
                <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center flex-none">
                    <h3 class="font-bold text-slate-800 flex items-center">
                        <i class="fas fa-clipboard-list text-slate-400 mr-2"></i> Withdrawal Summary
                    </h3>
                    <button onclick="clearCart()" id="btn-clear" class="hidden text-xs text-red-500 hover:text-red-700 font-bold bg-white border border-red-200 px-3 py-1 rounded shadow-sm hover:bg-red-50 transition">
                        <i class="fas fa-trash-alt mr-1"></i> Clear List
                    </button>
                </div>

                <!-- Table Header -->
                <div class="grid grid-cols-12 bg-slate-100 text-[10px] font-bold text-slate-500 uppercase py-3 px-4 border-b border-slate-200 flex-none">
                    <div class="col-span-2">Item</div>
                    <div class="col-span-2">Code</div>
                    <div class="col-span-5">Description</div>
                    <div class="col-span-2 text-center">Qty</div>
                    <div class="col-span-1 text-right"></div>
                </div>

                <!-- Table Body (Scrollable) -->
                <div class="flex-1 overflow-y-auto bg-white relative" id="cart-container">
                    <!-- Empty State -->
                    <div id="empty-cart" class="absolute inset-0 flex flex-col items-center justify-center text-slate-300 opacity-60">
                        <i class="fas fa-box-open text-6xl mb-4"></i>
                        <p class="font-medium text-sm">Your list is empty.</p>
                        <p class="text-xs">Select items from the left to begin.</p>
                    </div>
                    <!-- Items List -->
                    <div id="cart-list" class="divide-y divide-slate-50"></div>
                </div>

                <!-- Footer / Action -->
                <div class="p-6 bg-slate-50 border-t border-slate-200 flex-none">
                    <div class="flex justify-between items-end mb-4">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Line Items</span>
                        <span id="total-items-count" class="text-2xl font-bold text-slate-800">0</span>
                    </div>
                    <button onclick="processTransaction()" id="btn-process" disabled class="w-full py-4 bg-slate-200 text-slate-400 font-bold rounded-lg text-lg transition cursor-not-allowed flex items-center justify-center uppercase tracking-widest shadow-inner">
                        <i class="fas fa-check mr-2"></i> Confirm Withdrawal
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- LOGIC SCRIPT -->
    <script>
        // --- CONFIGURATION ---
        const SB_URL = 'https://agggkqvbnotpborqcitx.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnZ2drcXZibm90cGJvcnFjaXR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwODYxNjgsImV4cCI6MjA4MTY2MjE2OH0.XJHmLfRRJHVhsrImqnRpdwt7eN4eiO1VGk6B68uG5oo';
        
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        
        // --- STATE ---
        let inventory = [];
        let cart = [];

        $(document).ready(async () => {
            setInterval(() => $('#clock').text(new Date().toLocaleTimeString()), 1000);
            await initSystem();
        });

        async function initSystem() {
            generateRef();
            await loadData();
        }

        function generateRef() {
            // Generate a simpler, more readable ref ID
            const datePart = new Date().toISOString().slice(2,10).replace(/-/g,''); // YYMMDD
            const randPart = Math.floor(1000 + Math.random() * 9000); // 4 digit rand
            $('#w-ref').val(`WR-${datePart}-${randPart}`);
        }

        async function loadData() {
            try {
                // 1. Load Departments
                const { data: depts } = await supabaseClient.from('departments').select('*').order('name');
                if(depts) {
                    $('#w-dept').html('<option value="">-- Select Designation --</option>' + 
                        depts.map(d => `<option value="${d.name}">${d.name}</option>`).join(''));
                }

                // 2. Load Active Inventory with Images
                const { data: inv } = await supabaseClient.from('inventory').select('*').neq('status', 'ARCHIVED').order('description');
                inventory = inv || [];

                populateItemSelect();

            } catch (e) {
                console.error(e);
                Swal.fire('Connection Error', 'Failed to load system data. Check internet connection.', 'error');
            }
        }

        function populateItemSelect() {
            // Smart dropdown with status indicators
            let html = '<option value="">-- Choose Material --</option>';
            inventory.forEach(item => {
                let statusIcon = '🟢';
                if(item.current_stock <= 0) statusIcon = '🔴 (Out)';
                else if(item.current_stock <= item.low_stock_threshold) statusIcon = '🟠 (Low)';
                
                html += `<option value="${item.material_code}" ${item.current_stock <= 0 ? 'disabled class="bg-slate-100 text-slate-400"' : ''}>
                    ${statusIcon} ${item.description} [${item.material_code}]
                </option>`;
            });
            $('#w-item-select').html(html);
        }

        // --- UI LOGIC ---

        function checkStock(code) {
            $('#error-msg').text('');
            if(!code) {
                $('#stock-display').addClass('hidden');
                return;
            }
            const item = inventory.find(i => i.material_code === code);
            if(item) {
                $('#stock-qty-display').text(item.current_stock);
                $('#stock-uom-display').text(item.uom);
                $('#stock-desc-display').text(item.description);
                
                // Image Handling
                const imgHTML = item.image_link 
                    ? `<img src="${item.image_link}" class="img-preview">` 
                    : `<div class="img-placeholder-lg"><i class="fas fa-cube"></i></div>`;
                $('#stock-img-container').html(imgHTML);

                $('#stock-display').removeClass('hidden');
                
                // Visual feedback if low
                if(item.current_stock <= item.low_stock_threshold) {
                    $('#stock-display').removeClass('bg-royal-50 border-royal-100').addClass('bg-amber-50 border-amber-200');
                    $('#stock-qty-display').addClass('text-amber-600').removeClass('text-royal-800');
                } else {
                    $('#stock-display').addClass('bg-royal-50 border-royal-100').removeClass('bg-amber-50 border-amber-200');
                    $('#stock-qty-display').removeClass('text-amber-600').addClass('text-royal-800');
                }
                
                // Set max input
                $('#w-qty').attr('max', item.current_stock);
                $('#w-qty').val(1);
            }
        }

        function addToCart() {
            const code = $('#w-item-select').val();
            const qty = parseInt($('#w-qty').val());

            // Validation
            $('#error-msg').text('');
            if(!code) return $('#error-msg').text('Please select an item.');
            if(isNaN(qty) || qty <= 0) return $('#error-msg').text('Invalid quantity.');

            const item = inventory.find(i => i.material_code === code);
            
            // Check real stock
            if(qty > item.current_stock) return $('#error-msg').text(`Only ${item.current_stock} available.`);

            // Smart Cart Logic: Check if exists
            const existingIdx = cart.findIndex(c => c.code === code);
            
            if(existingIdx >= 0) {
                // Update existing
                const newTotal = cart[existingIdx].qty + qty;
                if(newTotal > item.current_stock) {
                     return $('#error-msg').text(`Total cart quantity (${newTotal}) exceeds stock.`);
                }
                cart[existingIdx].qty = newTotal;
            } else {
                // Add new
                cart.push({
                    code: item.material_code,
                    name: item.description,
                    qty: qty,
                    uom: item.uom,
                    image: item.image_link
                });
            }

            renderCart();
            $('#w-qty').val(1);
            
            // Visual success cues
            const btn = $('button[onclick="addToCart()"]');
            const originalContent = btn.html();
            btn.html('<i class="fas fa-check text-lg"></i>').addClass('bg-emerald-500').removeClass('bg-slate-800');
            setTimeout(() => {
                btn.html(originalContent).removeClass('bg-emerald-500').addClass('bg-slate-800');
            }, 500);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        function renderCart() {
            const container = $('#cart-list');
            const empty = $('#empty-cart');
            const btn = $('#btn-process');
            const clearBtn = $('#btn-clear');
            
            container.empty();
            
            if(cart.length === 0) {
                empty.removeClass('hidden');
                clearBtn.addClass('hidden');
                btn.prop('disabled', true)
                   .removeClass('bg-emerald-600 text-white hover:bg-emerald-700 shadow-lg')
                   .addClass('bg-slate-200 text-slate-400 cursor-not-allowed shadow-inner');
                $('#total-items-count').text('0');
                return;
            }

            empty.addClass('hidden');
            clearBtn.removeClass('hidden');
            btn.prop('disabled', false)
               .addClass('bg-emerald-600 text-white hover:bg-emerald-700 shadow-lg')
               .removeClass('bg-slate-200 text-slate-400 cursor-not-allowed shadow-inner');

            let totalItems = 0;

            cart.forEach((item, idx) => {
                totalItems += item.qty;
                const imgHTML = item.image 
                    ? `<img src="${item.image}" class="img-thumb">` 
                    : `<div class="img-placeholder-sm"><i class="fas fa-cube text-xs"></i></div>`;

                container.append(`
                    <div class="grid grid-cols-12 items-center py-3 px-4 hover:bg-slate-50 transition border-b border-slate-50 last:border-0">
                        <div class="col-span-2">${imgHTML}</div>
                        <div class="col-span-2 font-mono font-bold text-xs text-royal-700">${item.code}</div>
                        <div class="col-span-5 text-xs font-medium text-slate-700 truncate pr-2">${item.name}</div>
                        <div class="col-span-2 text-center">
                            <span class="bg-slate-100 font-bold px-2 py-1 rounded text-sm border border-slate-200">${item.qty}</span>
                        </div>
                        <div class="col-span-1 text-right">
                            <button onclick="removeFromCart(${idx})" class="text-slate-300 hover:text-red-500 transition"><i class="fas fa-times-circle text-lg"></i></button>
                        </div>
                    </div>
                `);
            });

            $('#total-items-count').text(cart.length);
        }

        // --- SUBMISSION LOGIC ---

        async function processTransaction() {
            const dept = $('#w-dept').val();
            const name = $('#w-name').val();
            const ref = $('#w-ref').val();

            if(!dept) return Swal.fire({icon:'warning', title:'Missing Info', text:'Please select a Department.'});
            if(!name) return Swal.fire({icon:'warning', title:'Missing Info', text:'Please enter the Recipient Name.'});

            // Confirm
            const result = await Swal.fire({
                title: 'Confirm Withdrawal?',
                html: `<div class="text-left text-sm">
                        <p><b>Recipient:</b> ${name}</p>
                        <p><b>Department:</b> ${dept}</p>
                        <p><b>Items:</b> ${cart.length} line items</p>
                       </div>`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                confirmButtonText: 'Yes, Issue Stock',
                cancelButtonText: 'Review'
            });

            if(!result.isConfirmed) return;

            // Show Loading
            Swal.fire({
                title: 'Processing...',
                html: 'Updating inventory and logging transaction.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading() }
            });

            try {
                // 1. Create Header
                const { data: wrData, error: wrError } = await supabaseClient
                    .from('withdrawal_requests')
                    .insert([{
                        wr_number: ref,
                        requester_name: name,
                        department: dept,
                        status: 'APPROVED', 
                        remarks: 'Portal Direct Issue'
                    }])
                    .select();

                if(wrError) throw wrError;
                const wrId = wrData[0].wr_id;

                // 2. Loop Items
                for (const item of cart) {
                    
                    // A. Insert Item Detail
                    await supabaseClient.from('wr_items').insert([{
                        wr_id: wrId,
                        material_code: item.code,
                        quantity_requested: item.qty
                    }]);

                    // B. Deduct Stock (Fetch fresh to be safe)
                    const { data: freshItem } = await supabaseClient.from('inventory').select('current_stock, total_withdrawn').eq('material_code', item.code).single();
                    
                    if(freshItem) {
                        const newStock = Math.max(0, freshItem.current_stock - item.qty);
                        const newWithdrawn = (freshItem.total_withdrawn || 0) + item.qty;

                        await supabaseClient.from('inventory')
                            .update({ current_stock: newStock, total_withdrawn: newWithdrawn })
                            .eq('material_code', item.code);

                        // C. Log Movement
                        await supabaseClient.from('stock_movements').insert([{
                            material_code: item.code,
                            change_amount: -item.qty, 
                            reason: `WR: ${ref}`
                        }]);
                    }
                }

                // Success
                await Swal.fire({
                    icon: 'success',
                    title: 'Dispensed Successfully',
                    text: `Reference: ${ref}`,
                    timer: 2000,
                    showConfirmButton: false
                });

                // Reset UI
                cart = [];
                renderCart();
                generateRef();
                $('#w-name').val('');
                $('#w-item-select').val('').trigger('change');
                
                // Reload data to reflect new stock levels immediately
                await loadData();

            } catch (err) {
                console.error(err);
                Swal.fire('Transaction Failed', err.message, 'error');
            }
        }
    </script>
</body>
</html>
