<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Updated Viewport for better mobile scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TRANSYSTEM | Live Monitor</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { 50:'#f5f7ff', 100:'#ebf0fe', 500:'#4f46e5', 600:'#4338ca', 700:'#3730a3', 900:'#1e1b4b' },
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'glow': '0 4px 20px 0px rgba(79, 70, 229, 0.4)'
                    }
                }
            }
        }
    </script>

    <style>
        /* Only hide overflow on Large screens (Desktop) */
        body { background-color: #f1f5f9; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        .skeleton { animation: shimmer 2s infinite linear; background: linear-gradient(to right, #f1f5f9 4%, #e2e8f0 25%, #f1f5f9 36%); background-size: 1000px 100%; }

        .item-card { transition: all 0.2s ease; border: 1px solid transparent; }
        .item-card:hover { transform: translateY(-2px); border-color: #e0e7ff; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .item-card.active { border-color: #4f46e5; background-color: #f5f7ff; ring: 2px solid #4f46e5; }

        /* Updated Detail Panel Transitions */
        #detail-panel { transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); z-index: 9999; }
        .drawer-closed { transform: translateY(110%); }
        .drawer-open { transform: translateY(0); }

        input:focus, select:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
    </style>
</head>

<!-- UPDATED BODY: Removed generic h-screen/overflow-hidden. Added specific LG classes -->
<!-- This allows the page to scroll on mobile so buttons are reachable -->
<body class="flex flex-col min-h-screen bg-slate-100 lg:h-screen lg:overflow-hidden overflow-y-auto">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 h-16 flex-none sticky top-0 z-40 px-4 md:px-6 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-brand-500 to-brand-700 p-2.5 rounded-xl shadow-lg shadow-brand-500/30">
                <i class="fas fa-boxes-stacked text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-black text-slate-800 tracking-tight leading-none text-base md:text-lg">TRANS<span class="text-brand-600">YSTEM</span></h1>
                <div class="flex items-center gap-2">
                    <span class="text-[9px] bg-slate-100 text-slate-500 px-1.5 rounded font-bold uppercase tracking-wider border border-slate-200">Inventory</span>
                    <span class="flex items-center gap-1 text-[9px] text-emerald-600 font-bold uppercase animate-pulse">
                        <i class="fas fa-circle text-[6px]"></i> Live
                    </span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden md:flex flex-col items-end">
                <span id="clock" class="font-mono font-bold text-slate-700 text-sm">--:--:--</span>
                <span id="date-display" class="text-[10px] text-slate-400 font-bold uppercase">...</span>
            </div>
            <button onclick="initSystem()" class="w-10 h-10 rounded-full bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-500 transition-colors flex items-center justify-center">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </nav>

    <!-- Main Workspace -->
    <!-- UPDATED: Flex-col on mobile (stacking), Flex-row on desktop. -->
    <main class="flex-1 flex flex-col lg:flex-row p-3 md:p-5 gap-4 md:gap-6 max-w-[1920px] mx-auto w-full">
        
        <!-- LEFT COLUMN: Inventory Browser -->
        <div class="flex-1 flex flex-col gap-4 min-w-0 lg:h-full lg:overflow-hidden">
            
            <!-- Header: Filters & Search -->
            <div class="bg-white p-4 rounded-2xl shadow-soft border border-slate-200 flex flex-col md:flex-row gap-3 justify-between items-center z-20">
                <div class="relative w-full md:max-w-md">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="item-search" placeholder="Search item name or code..." 
                           class="w-full pl-11 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold transition-all">
                    <button id="clear-search" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                        <i class="fas fa-times-circle"></i>
                    </button>
                </div>
                
                <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                    <button onclick="setFilter('all')" data-filter="all" class="filter-btn active whitespace-nowrap px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-brand-50 text-brand-700 border border-brand-200 shadow-sm">
                        All Items
                    </button>
                    <button onclick="setFilter('low')" data-filter="low" class="filter-btn whitespace-nowrap px-4 py-2.5 rounded-xl text-xs font-bold transition-all bg-white text-slate-500 border border-slate-200 hover:bg-slate-50">
                        Low Stock
                    </button>
                </div>
            </div>

            <!-- Content Area: List -->
            <!-- UPDATED: Removed relative absolute positioning for drawer. Drawer is now fixed to body. -->
            <div class="flex-1 bg-white rounded-2xl shadow-soft border border-slate-200 flex flex-col lg:overflow-hidden min-h-[400px]">
                
                <!-- Item List (Grid) -->
                <!-- UPDATED: overflow-y-auto only for large screens, otherwise auto height -->
                <div class="w-full lg:h-full lg:overflow-y-auto custom-scroll p-4">
                    <div id="item-loader" class="hidden grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3"></div>
                    
                    <div id="item-list-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
                        <!-- Items injected here -->
                    </div>
                    
                    <!-- Empty State -->
                    <div id="empty-state" class="hidden h-full flex flex-col items-center justify-center text-center p-8">
                        <div class="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mb-4 text-slate-300">
                            <i class="fas fa-search text-4xl"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800">No items found</h3>
                        <p class="text-sm text-slate-400">Try adjusting your search terms.</p>
                    </div>
                </div>

            </div>
        </div>

        <!-- RIGHT COLUMN: Transaction Cart -->
        <!-- UPDATED: height is auto on mobile (grows with content), fixed on desktop -->
        <div class="w-full lg:w-[400px] flex flex-col gap-4 flex-none lg:h-full">
            
            <!-- User Input Form -->
            <div class="bg-white p-5 rounded-2xl shadow-soft border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-800 text-sm uppercase tracking-wide">Request Details</h3>
                    <div id="tx-ref" class="text-[10px] font-mono bg-slate-100 px-2 py-1 rounded text-slate-500 font-bold">LOADING...</div>
                </div>
                
                <div class="space-y-3">
                    <div>
                        <select id="inp-dept" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:bg-white transition-colors">
                            <option value="">Select Department...</option>
                        </select>
                    </div>
                    <div>
                        <input type="text" id="inp-name" placeholder="Requesting Personnel Name" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white transition-colors">
                    </div>
                </div>
            </div>

            <!-- Cart Items -->
            <div class="flex-1 bg-white rounded-2xl shadow-soft border border-slate-200 flex flex-col overflow-hidden min-h-[300px]">
                <div class="p-4 border-b border-slate-50 flex justify-between items-center bg-slate-50/50">
                    <div class="flex items-center gap-2">
                        <div class="bg-brand-100 text-brand-600 w-6 h-6 rounded-md flex items-center justify-center text-xs font-bold" id="cart-badge">0</div>
                        <span class="text-sm font-bold text-slate-700">Withdrawal List</span>
                    </div>
                    <button onclick="clearCart()" class="text-xs font-bold text-slate-400 hover:text-red-500 transition-colors">Clear</button>
                </div>

                <div id="cart-container" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2">
                    <div id="cart-empty-msg" class="h-full flex flex-col items-center justify-center opacity-40">
                        <i class="fas fa-clipboard-list text-4xl mb-2"></i>
                        <span class="text-xs font-bold">List is empty</span>
                    </div>
                </div>

                <div class="p-4 bg-slate-50 border-t border-slate-100">
                    <button onclick="processCheckout()" id="btn-checkout" disabled class="group w-full py-3.5 bg-slate-200 text-slate-400 rounded-xl font-bold transition-all flex items-center justify-between px-6 cursor-not-allowed">
                        <span class="text-sm">CONFIRM ISSUE</span>
                        <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- DETAIL PANEL (Moved outside Main to be Fixed) -->
    <!-- UPDATED: class 'fixed' instead of absolute, z-50 to ensure it is on top -->
    <div id="detail-panel" class="fixed inset-0 pointer-events-none flex items-end justify-center lg:items-center lg:justify-end lg:p-4 drawer-closed">
                    
        <!-- Backdrop -->
        <div onclick="closeDetail()" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm pointer-events-auto transition-opacity duration-300 opacity-0 lg:hidden" id="detail-backdrop"></div>

        <!-- Panel Card -->
        <div class="bg-white w-full lg:w-[400px] h-[85vh] lg:h-full lg:max-h-[600px] rounded-t-3xl lg:rounded-3xl shadow-2xl pointer-events-auto flex flex-col overflow-hidden transform transition-all duration-300 border border-slate-100 relative z-50">
            
            <!-- Panel Header -->
            <div class="p-5 border-b border-slate-100 flex justify-between items-start bg-slate-50/50">
                <div>
                    <span id="dt-status" class="px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider bg-emerald-100 text-emerald-700">Available</span>
                    <h2 id="dt-name" class="mt-2 text-xl font-extrabold text-slate-800 leading-tight line-clamp-2">Product Name</h2>
                    <p id="dt-code" class="text-xs font-mono text-slate-400 mt-1 font-semibold">CODE-001</p>
                </div>
                <button onclick="closeDetail()" class="w-8 h-8 rounded-full bg-white border border-slate-200 text-slate-400 hover:text-red-500 flex items-center justify-center transition-colors shadow-sm">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Panel Body -->
            <div class="flex-1 overflow-y-auto custom-scroll p-6">
                
                <!-- Image Container -->
                <div class="flex justify-center mb-6">
                    <div id="dt-image-box" class="w-full h-56 bg-white rounded-2xl border border-slate-100 shadow-sm flex items-center justify-center overflow-hidden relative">
                        <!-- Image or Icon will be injected here -->
                        <i class="fas fa-box text-6xl text-slate-200"></i>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200/60">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Current Stock</label>
                        <div class="text-2xl font-black text-slate-800 mt-1" id="dt-stock">0</div>
                        <div class="text-[10px] font-bold text-brand-600" id="dt-uom">UNIT</div>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200/60">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Withdraw Qty</label>
                        <div class="flex items-center justify-between mt-2">
                            <button onclick="adjustQty(-1)" class="w-8 h-8 bg-white rounded-lg shadow-sm border border-slate-200 text-slate-500 hover:bg-slate-100"><i class="fas fa-minus text-xs"></i></button>
                            <input type="number" id="dt-qty-input" value="1" class="w-10 bg-transparent text-center font-bold text-lg focus:outline-none" readonly>
                            <button onclick="adjustQty(1)" class="w-8 h-8 bg-white rounded-lg shadow-sm border border-slate-200 text-slate-500 hover:bg-slate-100"><i class="fas fa-plus text-xs"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Panel Footer -->
            <div class="p-5 border-t border-slate-100 bg-white">
                <button onclick="addToCart()" id="btn-add-cart" class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold shadow-lg hover:bg-brand-600 hover:shadow-brand-500/30 transition-all flex items-center justify-center gap-2 transform active:scale-95">
                    <i class="fas fa-plus-circle"></i> <span>Add to List</span>
                </button>
            </div>
        </div>
    </div>

    <!-- JS Logic -->
    <script>
        const CONFIG = {
            url: 'https://agggkqvbnotpborqcitx.supabase.co',
            key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnZ2drcXZibm90cGJvcnFjaXR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwODYxNjgsImV4cCI6MjA4MTY2MjE2OH0.XJHmLfRRJHVhsrImqnRpdwt7eN4eiO1VGk6B68uG5oo'
        };

        const sb = supabase.createClient(CONFIG.url, CONFIG.key);
        
        let state = {
            inventory: [],
            cart: [],
            filter: 'all',
            search: '',
            selectedItem: null,
            txRef: ''
        };

        $(document).ready(() => {
            initSystem();
            setupEventListeners();
            startClock();
        });

        async function initSystem() {
            generateRef();
            showLoader(true);
            await fetchDepartments();
            await fetchInventory();
            subscribeToRealtime();
            showLoader(false);
        }

        function startClock() {
            const updateTime = () => {
                const now = new Date();
                $('#clock').text(now.toLocaleTimeString('en-US', {hour12: false}));
                $('#date-display').text(now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' }));
            };
            updateTime();
            setInterval(updateTime, 1000);
        }

        function generateRef() {
            state.txRef = 'WR-' + Date.now().toString().slice(-6) + '-' + Math.floor(Math.random() * 100);
            $('#tx-ref').text(state.txRef);
        }

        async function fetchDepartments() {
            const { data } = await sb.from('departments').select('name').order('name');
            if(data) {
                $('#inp-dept').html('<option value="">Select Department...</option>' + data.map(d => `<option value="${d.name}">${d.name}</option>`).join(''));
            }
        }

        async function fetchInventory() {
            const { data, error } = await sb.from('inventory').select('*').neq('status', 'ARCHIVED').order('description');
            if(error) return console.error(error);
            state.inventory = data;
            renderInventory();
        }

        function subscribeToRealtime() {
            sb.channel('public:inventory')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, payload => {
                    handleInventoryUpdate(payload);
                })
                .subscribe();
        }

        function handleInventoryUpdate(payload) {
            if (payload.eventType === 'UPDATE') {
                const idx = state.inventory.findIndex(i => i.id === payload.new.id);
                if(idx !== -1) {
                    state.inventory[idx] = payload.new;
                    renderInventory();
                    if(state.selectedItem && state.selectedItem.id === payload.new.id) {
                        openDetail(payload.new); 
                    }
                }
            } else if (payload.eventType === 'INSERT') {
                state.inventory.push(payload.new);
                renderInventory();
            }
        }

        function showLoader(show) {
            if(show) {
                $('#item-loader').removeClass('hidden').html(Array(6).fill('<div class="h-24 bg-white rounded-2xl p-4 border border-slate-200"><div class="h-4 w-1/3 bg-slate-100 skeleton rounded mb-2"></div><div class="h-3 w-3/4 bg-slate-100 skeleton rounded"></div></div>').join(''));
                $('#item-list-container').addClass('hidden');
            } else {
                $('#item-loader').addClass('hidden');
                $('#item-list-container').removeClass('hidden');
            }
        }

        function renderInventory() {
            const container = $('#item-list-container');
            container.empty();

            const filtered = state.inventory.filter(item => {
                const matchSearch = (item.description + item.material_code).toLowerCase().includes(state.search.toLowerCase());
                const matchFilter = state.filter === 'all' || (state.filter === 'low' && item.current_stock <= item.low_stock_threshold);
                return matchSearch && matchFilter;
            });

            if(filtered.length === 0) {
                $('#empty-state').removeClass('hidden');
            } else {
                $('#empty-state').addClass('hidden');
                filtered.forEach(item => {
                    const isLow = item.current_stock <= item.low_stock_threshold;
                    const noStock = item.current_stock <= 0;
                    
                    let statusColor = isLow ? 'bg-amber-500' : 'bg-brand-500';
                    if(noStock) statusColor = 'bg-red-500';

                    // Use Image if available, else Icon
                    let imageHTML;
                    if (item.image_link && item.image_link.trim() !== "") {
                        imageHTML = `<img src="${item.image_link}" class="w-16 h-16 rounded-xl object-cover bg-white border border-slate-100 flex-none" alt="item">`;
                    } else {
                        imageHTML = `<div class="w-16 h-16 rounded-xl bg-slate-50 flex items-center justify-center text-slate-300 border border-slate-100 flex-none"><i class="fas fa-box text-2xl"></i></div>`;
                    }

                    const html = `
                        <div onclick="selectItem('${item.material_code}')" class="item-card bg-white p-3 rounded-2xl cursor-pointer group flex gap-3 items-center">
                            ${imageHTML}
                            
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start mb-1">
                                    <span class="text-[9px] font-mono text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">${item.material_code}</span>
                                    ${noStock ? '<i class="fas fa-ban text-red-500 text-xs"></i>' : ''}
                                </div>
                                <h4 class="font-bold text-slate-700 text-xs line-clamp-2 leading-tight mb-2 group-hover:text-brand-600 transition-colors">${item.description}</h4>
                                
                                <div class="flex items-center gap-2">
                                    <div class="w-full h-1.5 rounded-full bg-slate-100 overflow-hidden flex-1">
                                        <div class="h-full ${statusColor}" style="width: ${Math.min(100, (item.current_stock/50)*100)}%"></div>
                                    </div>
                                    <span class="text-xs font-black ${noStock ? 'text-red-500' : 'text-slate-800'}">${item.current_stock}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    container.append(html);
                });
            }
        }

        function setupEventListeners() {
            $('#item-search').on('input', function() {
                state.search = $(this).val();
                if(state.search) $('#clear-search').removeClass('hidden'); 
                else $('#clear-search').addClass('hidden');
                renderInventory();
            });

            $('#clear-search').click(() => {
                $('#item-search').val('').trigger('input');
            });
        }

        function setFilter(type) {
            state.filter = type;
            $('.filter-btn').removeClass('active bg-brand-50 text-brand-700 border-brand-200 shadow-sm').addClass('bg-white text-slate-500 border-slate-200');
            $(`.filter-btn[data-filter="${type}"]`).addClass('active bg-brand-50 text-brand-700 border-brand-200 shadow-sm').removeClass('bg-white text-slate-500 border-slate-200');
            renderInventory();
        }

        function selectItem(code) {
            const item = state.inventory.find(i => i.material_code === code);
            if(item) openDetail(item);
        }

        function openDetail(item) {
            state.selectedItem = item;
            
            $('#dt-name').text(item.description);
            $('#dt-code').text(item.material_code);
            $('#dt-stock').text(item.current_stock);
            $('#dt-uom').text(item.uom);
            $('#dt-qty-input').val(1);

            // Handle Detail Image
            const imgBox = $('#dt-image-box');
            if(item.image_link && item.image_link.trim() !== "") {
                imgBox.html(`<img src="${item.image_link}" class="w-full h-full object-contain" alt="Product Image">`);
            } else {
                imgBox.html(`<i class="fas fa-box text-6xl text-slate-200"></i>`);
            }

            const btn = $('#btn-add-cart');
            const badge = $('#dt-status');
            
            if(item.current_stock <= 0) {
                badge.text('Out of Stock').removeClass().addClass('px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider bg-red-100 text-red-600');
                btn.prop('disabled', true).addClass('bg-slate-300 cursor-not-allowed').removeClass('bg-slate-900 hover:bg-brand-600 shadow-lg');
                btn.html('Unavailable');
            } else {
                const isLow = item.current_stock <= item.low_stock_threshold;
                badge.text(isLow ? 'Low Stock' : 'Available').removeClass().addClass(`px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider ${isLow ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'}`);
                btn.prop('disabled', false).removeClass('bg-slate-300 cursor-not-allowed').addClass('bg-slate-900 hover:bg-brand-600 shadow-lg');
                btn.html('<i class="fas fa-plus-circle"></i> <span>Add to List</span>');
            }

            $('#detail-backdrop').removeClass('hidden').css('opacity', '1');
            $('#detail-panel').removeClass('drawer-closed').addClass('drawer-open');
        }

        function closeDetail() {
            $('#detail-panel').removeClass('drawer-open').addClass('drawer-closed');
            $('#detail-backdrop').css('opacity', '0');
            setTimeout(() => $('#detail-backdrop').addClass('hidden'), 300);
            state.selectedItem = null;
        }

        function adjustQty(delta) {
            if(!state.selectedItem) return;
            const input = $('#dt-qty-input');
            let val = parseInt(input.val()) + delta;
            if(val >= 1 && val <= state.selectedItem.current_stock) {
                input.val(val);
            }
        }

        function addToCart() {
            if(!state.selectedItem) return;
            const qty = parseInt($('#dt-qty-input').val());
            const item = state.selectedItem;

            const existing = state.cart.find(c => c.code === item.material_code);
            
            if(existing) {
                if(existing.qty + qty > item.current_stock) {
                    Swal.fire({ icon:'warning', title:'Stock Limit', text:'Total quantity exceeds available stock.', toast:true, position:'top-end', showConfirmButton:false, timer:2000 });
                    return;
                }
                existing.qty += qty;
            } else {
                state.cart.push({
                    code: item.material_code,
                    name: item.description,
                    qty: qty,
                    uom: item.uom,
                    max: item.current_stock
                });
            }

            renderCart();
            closeDetail();
            Swal.fire({ icon:'success', title:'Added', text:`${qty} ${item.uom} added to list`, toast:true, position:'top-end', showConfirmButton:false, timer:1500 });
        }

        function renderCart() {
            const container = $('#cart-container');
            container.empty();

            if(state.cart.length === 0) {
                $('#cart-empty-msg').removeClass('hidden');
                $('#cart-badge').text('0');
                $('#btn-checkout').prop('disabled', true).removeClass('bg-brand-600 text-white shadow-glow').addClass('bg-slate-200 text-slate-400 cursor-not-allowed');
            } else {
                $('#cart-empty-msg').addClass('hidden');
                $('#cart-badge').text(state.cart.length);
                $('#btn-checkout').prop('disabled', false).addClass('bg-brand-600 text-white shadow-glow').removeClass('bg-slate-200 text-slate-400 cursor-not-allowed');

                state.cart.forEach((item, idx) => {
                    container.append(`
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center group animate-fade">
                            <div class="min-w-0 pr-2">
                                <div class="text-xs font-bold text-slate-800 truncate">${item.name}</div>
                                <div class="text-[10px] text-slate-400 font-mono">${item.code}</div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-black text-brand-600">${item.qty}<span class="text-[9px] ml-0.5 text-slate-400">${item.uom}</span></span>
                                <button onclick="removeFromCart(${idx})" class="w-6 h-6 rounded bg-white text-slate-300 hover:text-red-500 border border-slate-200 flex items-center justify-center transition-colors"><i class="fas fa-times text-xs"></i></button>
                            </div>
                        </div>
                    `);
                });
            }
        }

        function removeFromCart(idx) {
            state.cart.splice(idx, 1);
            renderCart();
        }

        function clearCart() {
            if(state.cart.length === 0) return;
            state.cart = [];
            renderCart();
        }

        async function processCheckout() {
            const dept = $('#inp-dept').val();
            const name = $('#inp-name').val();

            if(!dept || !name) {
                Swal.fire('Missing Info', 'Please provide Department and Requesting Personnel name.', 'warning');
                return;
            }

            const confirm = await Swal.fire({
                title: 'Confirm Transaction?',
                text: `Issuing ${state.cart.length} items to ${dept}`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#4f46e5',
                confirmButtonText: 'Yes, Issue Stock'
            });

            if(!confirm.isConfirmed) return;

            Swal.fire({ title: 'Processing...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const { data: wrData, error: wrError } = await sb.from('withdrawal_requests').insert([{
                    wr_number: state.txRef,
                    requester_name: name,
                    department: dept,
                    status: 'APPROVED',
                    remarks: 'Direct Issue via Portal'
                }]).select();

                if(wrError) throw wrError;
                const wrId = wrData[0].wr_id;

                for (const item of state.cart) {
                    const { data: freshStock } = await sb.from('inventory').select('current_stock, total_withdrawn').eq('material_code', item.code).single();
                    
                    if(!freshStock || freshStock.current_stock < item.qty) {
                        throw new Error(`Insufficient stock for ${item.name}. Update detected.`);
                    }

                    await sb.from('wr_items').insert({ wr_id: wrId, material_code: item.code, quantity_requested: item.qty });
                    
                    await sb.from('inventory').update({ 
                        current_stock: freshStock.current_stock - item.qty,
                        total_withdrawn: (freshStock.total_withdrawn || 0) + item.qty
                    }).eq('material_code', item.code);

                    await sb.from('stock_movements').insert({
                        material_code: item.code,
                        change_amount: -item.qty,
                        reason: `Issued: ${state.txRef}`
                    });
                }

                await Swal.fire('Success', 'Items successfully issued.', 'success');
                resetSystem();

            } catch (err) {
                console.error(err);
                Swal.fire('Error', err.message || 'Transaction failed', 'error');
            }
        }

        function resetSystem() {
            state.cart = [];
            $('#inp-name').val('');
            renderCart();
            generateRef();
        }
    </script>
    <script src="js/secure.js"></script>
</body>
</html>
