<!-- START OF FILE withdrawal-request.html -->

<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Quick Withdrawal | TRANS-SYSTEM</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f5f7ff', 100: '#ebf0fe', 500: '#4f46e5', 600: '#4338ca', 700: '#3730a3', 900: '#1e1b4b' },
                    },
                    borderRadius: { 'xl': '1rem', '2xl': '1.5rem' }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        
        /* Smooth Animations */
        .row-appear { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        #loader { position: fixed; inset: 0; background: #ffffff; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner-custom { width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top: 4px solid #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom Scrollbar for Dropdown */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="text-slate-900 pb-10" onclick="closeAllDropdowns(event)">

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner-custom mb-4"></div>
        <p class="text-brand-900 font-bold animate-pulse text-sm tracking-widest uppercase">Initializing System</p>
    </div>

    <!-- Header -->
    <header class="bg-brand-900 text-white shadow-2xl sticky top-0 z-40 rounded-b-3xl">
        <div class="max-w-2xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center border border-white/20">
                    <i class="fas fa-truck-ramp-box text-yellow-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight">TRANS-STORAGE</h1>
                    <p class="text-[10px] text-brand-200 font-medium uppercase tracking-wider opacity-80">Inventory Withdrawal Portal</p>
                </div>
            </div>
            <div id="gps-status" class="bg-black/20 px-3 py-1.5 rounded-full text-[10px] font-bold flex items-center gap-2 border border-white/10">
                <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse" id="gps-dot"></div>
                <span id="gps-text">GPS OFF</span>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 mt-6 space-y-6">
        
        <!-- Scanned Item Banner -->
        <div id="scan-alert" class="hidden bg-indigo-600 text-white p-4 rounded-2xl shadow-lg flex items-center justify-between animate-bounce">
            <div class="flex items-center gap-3">
                <i class="fas fa-barcode text-2xl"></i>
                <div>
                    <p class="text-xs font-bold uppercase opacity-80">Auto-Detected Item</p>
                    <p class="font-semibold" id="scan-msg">Item Found</p>
                </div>
            </div>
            <button onclick="$('#scan-alert').fadeOut()" class="text-white/50"><i class="fas fa-times"></i></button>
        </div>

        <form id="withdrawal-form" class="space-y-6">
            
            <!-- Requester Info -->
            <section class="glass-card p-6 rounded-3xl shadow-sm border border-slate-200">
                <div class="flex items-center gap-2 mb-6 border-b border-slate-100 pb-4">
                    <i class="fas fa-user-circle text-brand-500"></i>
                    <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Requester Information</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="md:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Full Name</label>
                        <input type="text" id="req-name" required placeholder="Ex. Juan Dela Cruz" 
                            class="w-full bg-slate-50 border-slate-200 rounded-xl p-3.5 border focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 transition-all outline-none text-sm">
                    </div>
                    <div class="md:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Department</label>
                        <select id="req-dept" required 
                            class="w-full bg-slate-50 border-slate-200 rounded-xl p-3.5 border focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 transition-all outline-none text-sm appearance-none cursor-pointer">
                            <option value="">Select Department...</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Work Order / Purpose</label>
                        <textarea id="req-reason" rows="2" placeholder="Describe why you need these items..." 
                            class="w-full bg-slate-50 border-slate-200 rounded-xl p-3.5 border focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 transition-all outline-none text-sm"></textarea>
                    </div>
                </div>
            </section>

            <!-- Items List -->
            <section class="glass-card p-6 rounded-3xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-boxes-stacked text-brand-500"></i>
                        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Requested Items</h2>
                    </div>
                    <button type="button" onclick="addItemRow()" 
                        class="bg-brand-50 text-brand-600 text-xs font-bold py-2 px-4 rounded-xl hover:bg-brand-100 transition-colors border border-brand-200 flex items-center gap-2">
                        <i class="fas fa-plus"></i> Add Item
                    </button>
                </div>
                
                <div id="items-container" class="space-y-4">
                    <!-- Rows injected here -->
                </div>
                
                <div id="empty-state" class="text-center py-10">
                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-box-open text-slate-300 text-2xl"></i>
                    </div>
                    <p class="text-slate-400 text-sm font-medium">No items added to this request.</p>
                </div>
            </section>

            <!-- Submission Area -->
            <div class="space-y-4">
                <div class="bg-amber-50 border border-amber-100 p-4 rounded-2xl flex gap-3">
                    <i class="fas fa-info-circle text-amber-500 mt-1"></i>
                    <p class="text-[11px] text-amber-800 leading-relaxed">
                        <strong>Notice:</strong> After submission, please contact the Person In-Charge to unlock the storage. <br/>
                        <span class="font-bold"><i class="fas fa-phone mr-1"></i> 0977-712-0595</span>
                    </p>
                </div>

                <button type="submit" id="submit-btn" 
                    class="w-full bg-brand-600 text-white font-extrabold py-5 rounded-2xl shadow-xl shadow-brand-500/20 hover:bg-brand-700 active:scale-[0.98] transition-all flex items-center justify-center gap-3 text-lg group">
                    <span>Submit Request</span>
                    <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </button>
            </div>
        </form>
    </main>

    <!-- Toast UI -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl opacity-0 translate-y-10 transition-all duration-300 z-50 pointer-events-none min-w-[320px]">
        <i id="toast-icon" class="text-lg"></i>
        <span id="toast-msg" class="text-sm font-bold uppercase tracking-wide"></span>
    </div>

    <script>
        const SUPABASE_URL = 'https://airrabkojxzzilgdcraz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpcnJhYmtvanh6emlsZ2RjcmF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg4NjY4MjEsImV4cCI6MjA3NDQ0MjgyMX0._XUe8Mk7jjY4RGyzaJ44mN5slfIP8pPYLNjcJYQkg-g';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let inventoryList = [];
        let collectedDeviceData = {};

        $(document).ready(async () => {
            initGPS();
            await loadInitialData();
            
            // Handle URL Parameters
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if(id) {
                // If scanned ID provided, try to find item and add row
                await loadInitialData(); // Ensure data is loaded
                const item = inventoryList.find(i => i.id == id);
                if(item) {
                    addItemRow(item.id);
                    $('#scan-msg').text(item.name);
                    $('#scan-alert').removeClass('hidden');
                } else {
                    addItemRow(); // Default empty
                }
            } else {
                addItemRow();
            }

            // Hide Loader
            $('#loader').fadeOut(500);
        });

        async function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        collectedDeviceData.geo = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                        $('#gps-dot').removeClass('bg-red-500').addClass('bg-green-500');
                        $('#gps-text').text('LOCATION SECURED').addClass('text-green-400');
                    },
                    () => { $('#gps-text').text('GPS DENIED'); }
                );
            }
            // Simple IP collection
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                collectedDeviceData.ip = data.ip;
                collectedDeviceData.ua = navigator.userAgent;
            } catch(e) {}
        }

        async function loadInitialData() {
            try {
                // Load Depts
                const { data: config } = await supabase.from('master_data').select('*').eq('key', 'config').single();
                const depts = config?.data?.departments || ['Maintenance', 'Operation', 'Admin', 'Safety'];
                depts.forEach(d => $('#req-dept').append(`<option value="${d}">${d}</option>`));

                // Load Inventory (include image column)
                const { data: inv } = await supabase.from('inventory').select('*').gt('stock', 0);
                inventoryList = inv || [];
            } catch (err) {
                console.error("Initial load error:", err);
            }
        }

        function addItemRow(preId = null) {
            $('#empty-state').hide();
            const rowId = 'row-' + Date.now();
            
            // Build the Custom Dropdown List
            let listItemsHtml = '';
            inventoryList.forEach(i => {
                const imgSrc = i.image && i.image.trim() !== '' ? i.image : 'https://placehold.co/100x100?text=No+Img';
                listItemsHtml += `
                    <div class="dropdown-item p-3 hover:bg-slate-50 cursor-pointer border-b border-slate-100 flex items-center gap-3 transition-colors" 
                         onclick="selectItem('${rowId}', ${i.id})"
                         data-name="${i.name.toLowerCase()}">
                        <img src="${imgSrc}" class="w-10 h-10 rounded-lg object-cover border border-slate-200 bg-white">
                        <div class="flex-1">
                            <p class="text-xs font-bold text-slate-700">${i.name}</p>
                            <p class="text-[10px] text-slate-400">Stock: ${i.stock} ${i.unit}</p>
                        </div>
                        <i class="fas fa-chevron-right text-slate-300 text-xs"></i>
                    </div>
                `;
            });

            // Pre-selection Logic
            let initialDisplay = `
                <div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400 mr-2">
                    <i class="fas fa-search"></i>
                </div>
                <span class="text-slate-400 text-xs">Tap to search item...</span>
            `;
            let inputValue = "";
            
            if (preId) {
                const item = inventoryList.find(i => i.id == preId);
                if (item) {
                    const imgSrc = item.image && item.image.trim() !== '' ? item.image : 'https://placehold.co/100x100?text=No+Img';
                    inputValue = item.id;
                    initialDisplay = `
                        <img src="${imgSrc}" class="w-8 h-8 rounded-lg object-cover border border-slate-200 mr-2">
                        <span class="text-slate-700 text-xs font-bold truncate flex-1">${item.name}</span>
                    `;
                }
            }

            const html = `
                <div id="${rowId}" class="row-appear bg-slate-50/50 border border-slate-200 p-4 rounded-2xl relative group hover:border-brand-300 transition-all shadow-sm hover:shadow-md">
                    <button type="button" onclick="removeRow('${rowId}')" class="absolute -top-2 -right-2 bg-white text-slate-400 hover:text-red-500 w-8 h-8 rounded-full shadow-md flex items-center justify-center border border-slate-100 transition-all hover:scale-110 z-10">
                        <i class="fas fa-times"></i>
                    </button>
                    
                    <div class="grid grid-cols-12 gap-4">
                        <!-- Custom Select Container -->
                        <div class="col-span-12 md:col-span-7 relative">
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Select Item</label>
                            
                            <!-- Hidden Input Stores Real Value -->
                            <input type="hidden" class="item-select-value" value="${inputValue}">

                            <!-- Visible Trigger -->
                            <div class="dropdown-trigger bg-white border border-slate-200 rounded-xl p-2 flex items-center cursor-pointer hover:border-brand-400 transition-colors" onclick="toggleDropdown('${rowId}', event)">
                                ${initialDisplay}
                            </div>

                            <!-- Dropdown Menu (Hidden) -->
                            <div id="dropdown-${rowId}" class="custom-dropdown hidden absolute top-full left-0 w-full bg-white border border-slate-200 shadow-xl rounded-xl z-50 mt-2 overflow-hidden max-h-60 flex flex-col">
                                <div class="p-2 border-b border-slate-100 bg-slate-50 sticky top-0 z-10">
                                    <input type="text" class="w-full text-xs p-2 rounded-lg border border-slate-200 focus:outline-none focus:border-brand-500" placeholder="Type to filter..." onkeyup="filterDropdown(this)">
                                </div>
                                <div class="overflow-y-auto custom-scrollbar flex-1 bg-white">
                                    ${listItemsHtml}
                                </div>
                            </div>
                        </div>

                        <div class="col-span-6 md:col-span-3">
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Quantity</label>
                            <div class="relative">
                                <input type="number" min="1" oninput="validateQty(this)" placeholder="0" 
                                    class="qty-input w-full bg-white border-slate-200 rounded-lg p-2.5 border text-sm font-bold text-center outline-none focus:border-brand-500" required>
                                <span class="unit-label absolute right-3 top-2.5 text-[10px] font-bold text-slate-400 pointer-events-none"></span>
                            </div>
                        </div>
                        <div class="col-span-6 md:col-span-2 flex flex-col justify-end">
                             <div class="stock-info text-[9px] font-bold text-slate-400 bg-slate-200/50 p-2 rounded-lg text-center truncate">STOCK: -</div>
                        </div>
                    </div>
                    <p class="qty-error text-[10px] text-red-500 font-bold mt-2 hidden"><i class="fas fa-exclamation-triangle mr-1"></i> Exceeds available stock!</p>
                </div>
            `;
            
            const $row = $(html);
            $('#items-container').append($row);
            
            // Auto scroll to new item
            $('html, body').animate({ scrollTop: $row.offset().top - 100 }, 400);

            // Initial validation if pre-selected
            if(preId) {
                const item = inventoryList.find(i => i.id == preId);
                updateRowStockInfo($row, item);
            }
        }

        // --- Custom Dropdown Logic ---

        function toggleDropdown(rowId, event) {
            event.stopPropagation(); // Prevent closing immediately
            // Close all others
            $('.custom-dropdown').not(`#dropdown-${rowId}`).addClass('hidden');
            $(`#dropdown-${rowId}`).toggleClass('hidden');
            // Focus search
            setTimeout(() => $(`#dropdown-${rowId} input`).focus(), 100);
        }

        function closeAllDropdowns(event) {
            if (!$(event.target).closest('.custom-dropdown, .dropdown-trigger').length) {
                $('.custom-dropdown').addClass('hidden');
            }
        }

        function filterDropdown(input) {
            const term = $(input).val().toLowerCase();
            $(input).closest('.custom-dropdown').find('.dropdown-item').each(function() {
                const name = $(this).data('name');
                if(name.includes(term)) $(this).show();
                else $(this).hide();
            });
        }

        function selectItem(rowId, itemId) {
            const item = inventoryList.find(i => i.id === itemId);
            if (!item) return;

            const $row = $(`#${rowId}`);
            
            // Update Hidden Value
            $row.find('.item-select-value').val(item.id);

            // Update Trigger UI
            const imgSrc = item.image && item.image.trim() !== '' ? item.image : 'https://placehold.co/100x100?text=No+Img';
            const triggerHtml = `
                <img src="${imgSrc}" class="w-8 h-8 rounded-lg object-cover border border-slate-200 mr-2">
                <span class="text-slate-700 text-xs font-bold truncate flex-1">${item.name}</span>
            `;
            $row.find('.dropdown-trigger').html(triggerHtml);

            // Hide Dropdown
            $row.find('.custom-dropdown').addClass('hidden');

            // Update Stock Info
            updateRowStockInfo($row, item);
        }

        function updateRowStockInfo($row, item) {
            if (!item) return;
            $row.find('.stock-info').text(`STOCK: ${item.stock}`);
            $row.find('.unit-label').text(item.unit || '');
            $row.find('.qty-input').attr('max', item.stock);
            validateQty($row.find('.qty-input')[0]);
        }

        function removeRow(id) {
            $(`#${id}`).fadeOut(300, function() { 
                $(this).remove(); 
                if($('.row-appear').length === 0) $('#empty-state').fadeIn();
            });
        }

        function validateQty(el) {
            const $el = $(el);
            const $row = $el.closest('.row-appear');
            const max = parseInt($el.attr('max')) || 0;
            const val = parseInt($el.val()) || 0;

            if(val > max) {
                $el.addClass('border-red-500 text-red-600 bg-red-50 shake');
                $row.find('.qty-error').show();
                $('#submit-btn').prop('disabled', true).addClass('opacity-50');
            } else {
                $el.removeClass('border-red-500 text-red-600 bg-red-50 shake');
                $row.find('.qty-error').hide();
                $('#submit-btn').prop('disabled', false).removeClass('opacity-50');
            }
        }

        $('#withdrawal-form').on('submit', async function(e) {
            e.preventDefault();
            const $btn = $('#submit-btn');
            
            const items = [];
            // Loop through rows using the custom value class
            $('.row-appear').each(function() {
                const id = $(this).find('.item-select-value').val();
                const qty = parseInt($(this).find('.qty-input').val());
                
                if(id && qty > 0) {
                    const itemObj = inventoryList.find(i => i.id == id);
                    if(itemObj) {
                        items.push({
                            id: id,
                            name: itemObj.name,
                            qty: qty,
                            unit: itemObj.unit
                        });
                    }
                }
            });

            if(items.length === 0) return showToast("Add at least one item", "error");

            $btn.html('<i class="fas fa-circle-notch fa-spin"></i> Processing...').prop('disabled', true);

            try {
                const payload = {
                    requester: $('#req-name').val(),
                    department: $('#req-dept').val(),
                    reason: $('#req-reason').val() + " [Mobile Scan]",
                    items: items,
                    status: 'Pending',
                    date: new Date().toLocaleDateString(),
                    metadata: collectedDeviceData
                };

                const { error } = await supabase.from('requests').insert(payload);
                if(error) throw error;

                showToast("Request Submitted!", "success");
                setTimeout(() => window.location.reload(), 2000);
            } catch (err) {
                console.error(err);
                showToast("Failed: " + (err.message || "Unknown error"), "error");
                $btn.html('Submit Request <i class="fas fa-arrow-right ml-2"></i>').prop('disabled', false);
            }
        });

        function showToast(msg, type) {
            const $toast = $('#toast');
            $('#toast-msg').text(msg);
            
            if(type === 'success') {
                $toast.addClass('bg-green-600 text-white').removeClass('bg-red-600');
                $('#toast-icon').attr('class', 'fas fa-check-circle');
            } else {
                $toast.addClass('bg-red-600 text-white').removeClass('bg-green-600');
                $('#toast-icon').attr('class', 'fas fa-exclamation-circle');
            }

            $toast.removeClass('opacity-0 translate-y-10').addClass('opacity-100 translate-y-0');
            setTimeout(() => {
                $toast.addClass('opacity-0 translate-y-10').removeClass('opacity-100 translate-y-0');
            }, 3000);
        }
    </script>
</body>
</html>
