<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWEBAPPS - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Animation Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        blob: "blob 7s infinite",
                        fadeIn: "fadeIn 0.8s ease-out forwards",
                        shake: "shake 0.5s cubic-bezier(.36,.07,.19,.97) both"
                    },
                    keyframes: {
                        blob: { "0%": { transform: "translate(0,0) scale(1)" }, "33%": { transform: "translate(30px,-50px) scale(1.1)" }, "66%": { transform: "translate(-20px,20px) scale(0.9)" }, "100%": { transform: "translate(0,0) scale(1)" } },
                        fadeIn: { "0%": { opacity: "0", transform: "translateY(20px)" }, "100%": { opacity: "1", transform: "translateY(0)" } },
                        shake: { "10%, 90%": { transform: "translate3d(-1px, 0, 0)" }, "20%, 80%": { transform: "translate3d(2px, 0, 0)" }, "30%, 50%, 70%": { transform: "translate3d(-4px, 0, 0)" }, "40%, 60%": { transform: "translate3d(4px, 0, 0)" } }
                    }
                }
            }
        }
    </script>

    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        body { background-color: #0f172a; overflow: hidden; }
    </style>
</head>
<body class="h-screen w-full relative flex items-center justify-center text-slate-200 antialiased selection:bg-cyan-500 selection:text-white">

    <!-- Background Animation -->
    <div class="absolute top-0 -left-4 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-blob"></div>
    <div class="absolute top-0 -right-4 w-72 h-72 bg-cyan-500 rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-blob animation-delay-4000"></div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md p-8 glass rounded-2xl shadow-2xl animate-fadeIn transform transition-all">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">GWEBAPPS</h2>
            <p class="text-sm text-gray-400 mt-2"><span style="background:brown;color:white; padding:1%;">Gilbert</span> <span style="padding:1%;background:red;color:white;">Web</span> <span style="background:Orange; padding:1%; color:#000;">Application</span></p>
            <p class="text-sm text-gray-400 mt-2">Welcome back! Please login to continue.</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div class="group">
                <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1 ml-1">Username</label>
                <input type="text" id="username" class="w-full pl-4 pr-4 py-3 bg-slate-800/50 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 text-white placeholder-gray-500 transition-all duration-300" placeholder="Username" required>
            </div>

            <div class="group">
                <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1 ml-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" class="w-full pl-4 pr-10 py-3 bg-slate-800/50 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 text-white placeholder-gray-500 transition-all duration-300" placeholder="Password" required>
                    <!-- Eye Icon Toggle -->
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-gray-500 hover:text-white" onclick="togglePassword()">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 px-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-lg shadow-lg transform transition-all duration-200 hover:scale-[1.02] active:scale-95 flex justify-center items-center gap-2">
                <span>Login Securely</span>
                <svg id="arrowIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                <svg id="loadingIcon" class="animate-spin h-5 w-5 text-white hidden" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>

            <div id="errorMsg" class="hidden text-center p-3 rounded bg-red-500/10 border border-red-500/50 text-red-200 text-sm font-medium">Invalid Credentials</div>
        </form>
    </div>

    <!-- UI Helper for Eye Icon -->
    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const eye = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eye.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />';
            } else {
                pwd.type = 'password';
                eye.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
            }
        }
    </script>

    <script src="js/auth.js"></script>

</body>
</html>
